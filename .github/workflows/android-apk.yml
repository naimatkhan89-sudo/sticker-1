
name: Build Naimat Khan 3D Text Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          unzip -q Naimat_Khan_3D_Text_Studio_GitHub_Build.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -type f -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gradle dependency placement
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1]) / "app" / "build.gradle"
          lines = p.read_text().splitlines()

          dep = "implementation 'androidx.core:core-ktx:1.15.0'"
          lines = [
              line for line in lines
              if "androidx.core:core-ktx:1.15.0" not in line
          ]

          for i, line in enumerate(lines):
              if line.strip() == "dependencies {":
                  lines.insert(i + 1, "    " + dep)
                  break
          else:
              lines.extend(["", "dependencies {", "    " + dep, "}"])

          p.write_text("\n".join(lines) + "\n")
          print("Gradle dependency placement fixed.")
          PY

      - name: Align Java and Kotlin targets
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1]) / "app" / "build.gradle"
          s = p.read_text()

          s = re.sub(
              r'(sourceCompatibility\s+)(?:JavaVersion\.VERSION_1_8|1\.8)',
              r'\g<1>JavaVersion.VERSION_17', s
          )
          s = re.sub(
              r'(targetCompatibility\s+)(?:JavaVersion\.VERSION_1_8|1\.8)',
              r'\g<1>JavaVersion.VERSION_17', s
          )

          if "compileOptions {" not in s:
              s = re.sub(
                  r'(android\s*\{)',
                  r"""\1
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """, s, count=1
              )

          if "kotlinOptions {" in s:
              s = re.sub(
                  r"jvmTarget\s*=\s*['\"](?:1\.8|17)['\"]",
                  "jvmTarget = '17'", s
              )
          else:
              s = re.sub(
                  r'(android\s*\{)',
                  r"""\1
              kotlinOptions {
                  jvmTarget = '17'
              }
          """, s, count=1
              )

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naimat-Khan-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
